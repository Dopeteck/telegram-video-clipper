name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-python:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall -q chopify.py dashboard.py projects.py captions.py branding.py semantic.py download_and_transcribe.py score_clips.py render_clips.py tighten.py tools

      - name: Install ffmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y

      - name: Install ffmpeg and fonts on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation

      - name: Run Chopify tests
        run: pytest tests/ -q

      - name: Build public documentation
        run: python tools/build_site.py --out _site

  test-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        working-directory: ./worker
        run: npm ci

      - name: TypeScript type check
        working-directory: ./worker
        run: npm run typecheck

      - name: Run worker tests
        working-directory: ./worker
        run: npm test

      - name: Build worker
        working-directory: ./worker
        run: npm run build

  test-miniapp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: miniapp/package-lock.json

      - name: Install miniapp dependencies
        working-directory: ./miniapp
        run: npm ci

      - name: TypeScript type check
        working-directory: ./miniapp
        run: npx tsc --noEmit

      - name: Run miniapp tests
        working-directory: ./miniapp
        run: npm test

      - name: Build miniapp
        working-directory: ./miniapp
        run: npm run build
        env:
          VITE_API_BASE_URL: https://telegram-video-clipper-worker-production.adegunwa3.workers.dev

  deploy-worker:
    needs: [test-python, test-worker, test-miniapp]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        working-directory: ./worker
        run: npm ci

      - name: Build worker
        working-directory: ./worker
        run: npm run build

      - name: Apply D1 migrations before Worker deployment
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./worker
          command: d1 migrations apply telegram-video-clipper --remote

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./worker
          environment: production

  deploy-miniapp:
    needs: [test-python, test-worker, test-miniapp]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: miniapp/package-lock.json

      - name: Install miniapp dependencies
        working-directory: ./miniapp
        run: npm ci

      - name: Build miniapp
        working-directory: ./miniapp
        run: npm run build
        env:
          VITE_API_BASE_URL: https://telegram-video-clipper-worker-production.adegunwa3.workers.dev

      - name: Deploy Mini App to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./miniapp/dist --project-name=telegram-video-clipper-miniapp --branch=main