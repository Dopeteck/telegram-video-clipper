name: Process Video

on:
  repository_dispatch:
    types: [process-video]
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID'
        required: true
        type: string
      upload_id:
        description: 'Upload ID'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  WORKER_URL: ${{ secrets.WORKER_URL }}
  WORKER_SECRET: ${{ secrets.WORKER_SECRET }}

# NOTE on step outputs: every `python` step below writes its step outputs
# explicitly to the file named by $GITHUB_OUTPUT as `key=value` lines. Printing
# to stdout is for logs only. (Piping stdout into $GITHUB_OUTPUT makes the runner
# reject any log line that is not `key=value` with "Invalid format".)

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check dispatch payload
        env:
          JOB_ID: ${{ github.event.client_payload.job_id }}
          UPLOAD_ID: ${{ github.event.client_payload.upload_id }}
          OBJECT_KEY: ${{ github.event.client_payload.object_key }}
        run: |
          echo "event=${{ github.event_name }} job_id=${JOB_ID} upload_id=${UPLOAD_ID}"
          if [ -z "$JOB_ID" ] || [ -z "$UPLOAD_ID" ] || [ -z "$OBJECT_KEY" ]; then
            echo "::error::Missing job_id/upload_id/object_key in client_payload. This workflow must be triggered by the Worker's repository_dispatch (event_type process-video)."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install requests

      - name: Report job started
        env:
          JOB_ID: ${{ github.event.client_payload.job_id }}
        run: |
          python - <<'PY'
          import os
          import requests

          job_id = os.environ['JOB_ID']
          worker_url = os.environ['WORKER_URL']
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"

          response = requests.post(
              f'{worker_url}/api/internal/jobs/{job_id}/complete',
              headers={'Authorization': f"Bearer {os.environ['WORKER_SECRET']}", 'Content-Type': 'application/json'},
              json={'clips': [], 'status': 'processing', 'github_run_url': run_url},
              timeout=30,
          )
          print(f'Report started: {response.status_code} {response.text}')
          response.raise_for_status()
          PY

      - name: Download source video using Worker-signed URL
        id: download
        env:
          JOB_ID: ${{ github.event.client_payload.job_id }}
        run: |
          python - <<'PY'
          import os
          import requests

          job_id = os.environ['JOB_ID']
          worker_url = os.environ['WORKER_URL']
          headers = {'Authorization': f"Bearer {os.environ['WORKER_SECRET']}"}

          signed_response = requests.get(
              f'{worker_url}/api/internal/jobs/{job_id}/source-url',
              headers=headers,
              timeout=30,
          )
          print(f'Worker source URL response: {signed_response.status_code}')
          signed_response.raise_for_status()
          source = signed_response.json()['data']

          filename = os.path.basename(source.get('filename') or 'source-video.mp4')
          local_path = f'/tmp/{filename}'
          print(f'Downloading source video to {local_path}')

          with requests.get(source['url'], stream=True, timeout=(30, 600)) as response:
              response.raise_for_status()
              with open(local_path, 'wb') as output:
                  for chunk in response.iter_content(chunk_size=8 * 1024 * 1024):
                      if chunk:
                          output.write(chunk)

          size = os.path.getsize(local_path)
          if size == 0:
              raise RuntimeError('Downloaded source video is empty')
          print(f'Downloaded {size} bytes')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'video_path={local_path}\n')
          PY

      - name: Get job preferences
        id: prefs
        env:
          JOB_ID: ${{ github.event.client_payload.job_id }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests

          job_id = os.environ['JOB_ID']
          response = requests.get(
              f"{os.environ['WORKER_URL']}/api/internal/jobs/{job_id}",
              headers={'Authorization': f"Bearer {os.environ['WORKER_SECRET']}"},
              timeout=30,
          )
          response.raise_for_status()
          job = response.json()['data']
          print(f'Job: {json.dumps(job)}')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"aspect_ratio={job.get('aspect_ratio') or '9:16'}\n")
              out.write(f"style={job.get('caption_style') or 'default'}\n")
              out.write(f"enable_tighten={job.get('enable_tighten') or 0}\n")
              out.write(f"enable_loudnorm={job.get('enable_loudnorm') or 0}\n")
          PY

      - name: Run Chopify processing
        id: chopify
        env:
          VIDEO_PATH: ${{ steps.download.outputs.video_path }}
          ASPECT_RATIO: ${{ steps.prefs.outputs.aspect_ratio }}
          STYLE: ${{ steps.prefs.outputs.style }}
          ENABLE_TIGHTEN: ${{ steps.prefs.outputs.enable_tighten }}
          ENABLE_LOUDNORM: ${{ steps.prefs.outputs.enable_loudnorm }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import json

          video_path = os.environ['VIDEO_PATH']
          aspect_ratio = os.environ['ASPECT_RATIO']
          style = os.environ['STYLE']
          enable_tighten = os.environ['ENABLE_TIGHTEN'] == '1'
          enable_loudnorm = os.environ['ENABLE_LOUDNORM'] == '1'
          job_id = os.environ['JOB_ID']

          work_dir = f'/tmp/chopify_work_{job_id}'
          os.makedirs(work_dir, exist_ok=True)
          out_dir = f'{work_dir}/clips'
          os.makedirs(out_dir, exist_ok=True)

          cmd = [
              'python', 'chopify.py', video_path,
              '--aspect', aspect_ratio,
              '--style', style,
              '--workdir', work_dir,
              '--out', out_dir,
              '--action', 'all',
              '--no-preflight',
          ]
          if enable_tighten:
              cmd.append('--tighten')
          if enable_loudnorm:
              cmd.append('--loudnorm')

          print('Running: ' + ' '.join(cmd))
          result = subprocess.run(cmd, capture_output=True, text=True, cwd='.')
          print(f'stdout: {result.stdout}')
          print(f'stderr: {result.stderr}')
          print(f'returncode: {result.returncode}')

          if result.returncode != 0:
              sys.exit(1)

          clips = [os.path.join(out_dir, f) for f in sorted(os.listdir(out_dir)) if f.endswith('.mp4')]
          print(f'Found {len(clips)} clip(s)')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'clips={json.dumps(clips)}\n')
          PY

      - name: Upload clips to R2 using Worker-signed URLs
        id: upload
        env:
          JOB_ID: ${{ github.event.client_payload.job_id }}
          CLIPS_JSON: ${{ steps.chopify.outputs.clips }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests

          clips = json.loads(os.environ.get('CLIPS_JSON') or '[]')
          job_id = os.environ['JOB_ID']
          worker_url = os.environ['WORKER_URL']
          headers = {'Authorization': f"Bearer {os.environ['WORKER_SECRET']}"}

          uploaded = []
          if clips:
              filenames = [os.path.basename(clip) for clip in clips]
              signed_response = requests.post(
                  f'{worker_url}/api/internal/jobs/{job_id}/output-urls',
                  headers={**headers, 'Content-Type': 'application/json'},
                  json={'filenames': filenames},
                  timeout=30,
              )
              print(f'Worker output URL response: {signed_response.status_code}')
              signed_response.raise_for_status()
              signed_uploads = signed_response.json()['data']['uploads']
              urls_by_name = {item['filename']: item for item in signed_uploads}

              for clip in clips:
                  filename = os.path.basename(clip)
                  target = urls_by_name.get(filename)
                  if not target:
                      raise RuntimeError(f'Worker did not return an upload URL for {filename}')

                  size = os.path.getsize(clip)
                  with open(clip, 'rb') as source:
                      response = requests.put(
                          target['url'],
                          data=source,
                          headers={
                              'Content-Type': 'video/mp4',
                              'Content-Length': str(size),
                          },
                          timeout=(30, 600),
                      )
                  response.raise_for_status()
                  uploaded.append(target['key'])
                  print(f'Uploaded {filename} ({size} bytes) to R2')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'uploaded={json.dumps(uploaded)}\n')
          PY

      - name: Report completion to Worker
        if: always()
        env:
          JOB_ID: ${{ github.event.client_payload.job_id }}
          CLIPS_JSON: ${{ steps.upload.outputs.uploaded }}
          CHOPIFY_OUTCOME: ${{ steps.chopify.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          python - <<'PY'
          import os
          import json
          import sys
          import requests

          job_id = os.environ['JOB_ID']
          worker_url = os.environ['WORKER_URL']
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"

          chopify = os.environ.get('CHOPIFY_OUTCOME', '')
          upload = os.environ.get('UPLOAD_OUTCOME', '')
          success = chopify == 'success' and upload == 'success'
          clips = json.loads(os.environ.get('CLIPS_JSON') or '[]') if success else []

          payload = {'clips': clips, 'status': 'completed' if success else 'failed', 'github_run_url': run_url}
          if not success:
              payload['error_message'] = f'Workflow failed (processing: {chopify or "not run"}, upload: {upload or "not run"}). See {run_url}'

          response = requests.post(
              f'{worker_url}/api/internal/jobs/{job_id}/complete',
              headers={'Authorization': f"Bearer {os.environ['WORKER_SECRET']}", 'Content-Type': 'application/json'},
              json=payload,
              timeout=30,
          )
          print(f'Report completion: {response.status_code} {response.text}')
          if not response.ok:
              sys.exit(1)
          PY
