name: Process Video

on:
  repository_dispatch:
    types: [process-video]
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID'
        required: true
        type: string
      upload_id:
        description: 'Upload ID'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  WORKER_URL: ${{ secrets.WORKER_URL }}
  WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# NOTE on step outputs: every `python` step below writes its step outputs
# explicitly to the file named by $GITHUB_OUTPUT as `key=value` lines. Printing
# to stdout is for logs only. (Piping stdout into $GITHUB_OUTPUT makes the runner
# reject any log line that is not `key=value` with "Invalid format".)

jobs:
  # YouTube's player API often rejects hosted CI egress. Download only on the
  # owner's trusted Windows runner, then place the source in the existing R2
  # object already associated with this job. No video processing happens here.
  extract-youtube:
    if: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.source_url != '' }}
    runs-on: [self-hosted, windows, x64, youtube-extractor]
    timeout-minutes: 90
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install downloader dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --pre "yt-dlp[default]" boto3
          if (-not (Get-Command deno -ErrorAction SilentlyContinue)) {
            irm https://deno.land/install.ps1 | iex
            $denoBin = Join-Path (Join-Path $HOME ".deno") "bin"
            if (Test-Path $denoBin) {
              $env:PATH = "$denoBin;$env:PATH"
              Add-Content -Path $env:GITHUB_PATH -Value $denoBin
            }
          }
          if (-not (Get-Command deno -ErrorAction SilentlyContinue)) {
            Write-Error "Deno installation failed. Install Deno for the runner account and retry."
          }
          python -m yt_dlp --version
          deno --version

      - name: Download YouTube source and upload it to its existing R2 object
        shell: pwsh
        env:
          SOURCE_URL: ${{ github.event.client_payload.source_url }}
          OBJECT_KEY: ${{ github.event.client_payload.object_key }}
          YTDLP_COOKIES_B64: ${{ secrets.YTDLP_COOKIES_B64 }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: telegram-video-clipper-uploads
        run: |
          @'
          import base64
          import os
          import subprocess
          import sys
          from pathlib import Path
          import boto3
          from botocore.config import Config

          required = ("SOURCE_URL", "OBJECT_KEY", "YTDLP_COOKIES_B64",
                      "R2_ACCOUNT_ID", "R2_ACCESS_KEY_ID", "R2_SECRET_ACCESS_KEY")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing required extraction configuration: " + ", ".join(missing))

          temp = Path(os.environ["RUNNER_TEMP"])
          cookies = temp / "youtube-cookies.txt"
          output_template = str(temp / "youtube-source.%(ext)s")
          try:
              raw = base64.b64decode("".join(os.environ["YTDLP_COOKIES_B64"].split()), validate=True)
              decoded = raw.decode("utf-8-sig")
              if not any(len(line.split("\t")) == 7 for line in decoded.splitlines()
                         if (line.strip() and not line.startswith("#")) or line.startswith("#HttpOnly_")):
                  raise ValueError("not a Netscape cookies file")
              cookies.write_bytes(raw)
          except Exception as exc:
              raise SystemExit("YouTube cookies secret is invalid (" + type(exc).__name__ + ").")

          command = [
              sys.executable, "-m", "yt_dlp",
              "--no-playlist", "--no-progress", "--quiet",
              "--cookies", str(cookies),
              "-f", "bv*[height<=1080]+ba/b[height<=1080]",
              "--merge-output-format", "mp4",
              "-o", output_template,
              os.environ["SOURCE_URL"],
          ]
          try:
              result = subprocess.run(command, capture_output=True, text=True, timeout=75 * 60)
              if result.returncode:
                  # Never print yt-dlp output: it can contain the private source URL.
                  raise RuntimeError("yt-dlp exited with code " + str(result.returncode))
              candidates = [p for p in temp.glob("youtube-source.*")
                            if p.is_file() and p.suffix.lower() in {".mp4", ".mkv", ".webm", ".mov"}]
              if not candidates:
                  raise RuntimeError("yt-dlp completed without producing a video file")
              source = max(candidates, key=lambda p: p.stat().st_size)
              if source.stat().st_size < 1024 * 1024:
                  raise RuntimeError("Downloaded source is unexpectedly small")

              client = boto3.client(
                  "s3",
                  endpoint_url=f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com",
                  aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
                  aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
                  region_name="auto",
                  config=Config(signature_version="s3v4", connect_timeout=20, read_timeout=300,
                                retries={"mode": "standard", "total_max_attempts": 4}),
              )
              client.upload_file(str(source), os.environ["R2_BUCKET"], os.environ["OBJECT_KEY"],
                                 ExtraArgs={"ContentType": {".mp4": "video/mp4", ".mkv": "video/x-matroska", ".webm": "video/webm", ".mov": "video/quicktime"}.get(source.suffix.lower(), "application/octet-stream")})
              head = client.head_object(Bucket=os.environ["R2_BUCKET"], Key=os.environ["OBJECT_KEY"])
              if head.get("ContentLength", 0) != source.stat().st_size:
                  raise RuntimeError("R2 source verification failed: uploaded size mismatch")
              print(f"YouTube source downloaded and verified in R2 ({source.stat().st_size} bytes).")
          finally:
              cookies.unlink(missing_ok=True)
              for path in temp.glob("youtube-source.*"):
                  path.unlink(missing_ok=True)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  process:
    needs: [extract-youtube]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check dispatch payload
        env:
          JOB_ID: ${{ github.event.client_payload.job_id || inputs.job_id }}
          UPLOAD_ID: ${{ github.event.client_payload.upload_id || inputs.upload_id }}
        run: |
          echo "event=${{ github.event_name }} job_id=${JOB_ID} upload_id=${UPLOAD_ID}"
          if [ -z "$JOB_ID" ] || [ -z "$UPLOAD_ID" ]; then
            echo "::error::Missing job_id or upload_id in workflow dispatch payload."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-noto-cjk nodejs npm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install requests boto3

      - name: Report job started
        env:
          JOB_ID: ${{ github.event.client_payload.job_id || inputs.job_id }}
        run: |
          python - <<'PY'
          import os
          import requests

          job_id = os.environ['JOB_ID']
          worker_url = os.environ['WORKER_URL']
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"

          response = requests.post(
              f'{worker_url}/api/internal/jobs/{job_id}/complete',
              headers={'Authorization': f"Bearer {os.environ['WORKER_SECRET']}", 'Content-Type': 'application/json'},
              json={'clips': [], 'status': 'processing', 'github_run_url': run_url},
              timeout=30,
          )
          print(f'Report started: {response.status_code} {response.text}')
          response.raise_for_status()
          PY

      - name: Download video via Worker presigned URL
        id: download
        if: ${{ needs.extract-youtube.result != 'failure' }}
        env:
          JOB_ID: ${{ github.event.client_payload.job_id || inputs.job_id }}
        run: |
          python - <<'PY'
          import os
          import requests

          job_id = os.environ['JOB_ID']
          worker_url = os.environ['WORKER_URL']
          worker_secret = os.environ['WORKER_SECRET']
          local_path = f'/tmp/video_{os.environ["GITHUB_RUN_ID"]}.mp4'

          # For YouTube imports, the Windows extraction job has already placed
          # the source at the upload's existing R2 object key. For normal uploads,
          # this is the same presigned download path used previously.
          resp = requests.get(
              f'{worker_url}/api/internal/jobs/{job_id}/download-url',
              headers={'Authorization': f'Bearer {worker_secret}'},
              timeout=30,
          )
          resp.raise_for_status()
          download_url = resp.json()['data']['url']

          print('Downloading source from private R2 storage (URL redacted)...')
          with requests.get(download_url, stream=True, timeout=600) as r:
              r.raise_for_status()
              with open(local_path, 'wb') as f:
                  for chunk in r.iter_content(chunk_size=1024 * 1024):
                      if chunk:
                          f.write(chunk)

          size = os.path.getsize(local_path)
          if size == 0:
              raise RuntimeError('Downloaded source file is empty')
          print(f'Downloaded {size} bytes from private R2 storage.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'video_path={local_path}\n')
          PY

      - name: Get job preferences
        id: prefs
        env:
          JOB_ID: ${{ github.event.client_payload.job_id || inputs.job_id }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests

          job_id = os.environ['JOB_ID']
          response = requests.get(
              f"{os.environ['WORKER_URL']}/api/internal/jobs/{job_id}",
              headers={'Authorization': f"Bearer {os.environ['WORKER_SECRET']}"},
              timeout=30,
          )
          response.raise_for_status()
          job = response.json()['data']
          print(f'Job: {json.dumps(job)}')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"aspect_ratio={job.get('aspect_ratio') or '9:16'}\n")
              out.write(f"style={job.get('caption_style') or 'default'}\n")
              out.write(f"enable_tighten={job.get('enable_tighten') or 0}\n")
              out.write(f"enable_loudnorm={job.get('enable_loudnorm') or 0}\n")
          PY

      - name: Run Chopify processing
        id: chopify
        env:
          VIDEO_PATH: ${{ steps.download.outputs.video_path }}
          ASPECT_RATIO: ${{ steps.prefs.outputs.aspect_ratio }}
          STYLE: ${{ steps.prefs.outputs.style }}
          ENABLE_TIGHTEN: ${{ steps.prefs.outputs.enable_tighten }}
          ENABLE_LOUDNORM: ${{ steps.prefs.outputs.enable_loudnorm }}
          JOB_ID: ${{ github.event.client_payload.job_id || inputs.job_id }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import json

          video_path = os.environ['VIDEO_PATH']
          aspect_ratio = os.environ['ASPECT_RATIO']
          style = os.environ['STYLE']
          enable_tighten = os.environ['ENABLE_TIGHTEN'] == '1'
          enable_loudnorm = os.environ['ENABLE_LOUDNORM'] == '1'
          job_id = os.environ['JOB_ID']

          work_dir = f'/tmp/chopify_work_{job_id}'
          os.makedirs(work_dir, exist_ok=True)
          out_dir = f'{work_dir}/clips'
          os.makedirs(out_dir, exist_ok=True)

          cmd = [
              'python', 'chopify.py', video_path,
              '--aspect', aspect_ratio,
              '--style', style,
              '--workdir', work_dir,
              '--out', out_dir,
              '--action', 'all',
              '--no-preflight',
              '--max-clips', '3',
              '--min-score', '5.5',
          ]
          if enable_tighten:
              cmd.append('--tighten')
          if enable_loudnorm:
              cmd.append('--loudnorm')

          display_cmd = cmd.copy()
          if video_path.startswith('https://www.youtube.com/'):
              display_cmd[2] = '[YouTube URL redacted]'
          print('Running: ' + ' '.join(display_cmd))
          result = subprocess.run(cmd, capture_output=True, text=True, cwd='.')
          safe_stdout = result.stdout.replace(video_path, '[YouTube URL redacted]') if video_path.startswith('https://www.youtube.com/') else result.stdout
          safe_stderr = result.stderr.replace(video_path, '[YouTube URL redacted]') if video_path.startswith('https://www.youtube.com/') else result.stderr
          print(f'stdout: {safe_stdout}')
          print(f'stderr: {safe_stderr}')
          print(f'returncode: {result.returncode}')

          if result.returncode != 0:
              sys.exit(1)

          clips = [os.path.join(out_dir, f) for f in sorted(os.listdir(out_dir)) if f.endswith('.mp4')]
          print(f'Found {len(clips)} clip(s)')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'clips={json.dumps(clips)}\n')
          PY

      - name: Upload clips to R2
        id: upload
        env:
          JOB_ID: ${{ github.event.client_payload.job_id || inputs.job_id }}
          CLIPS_JSON: ${{ steps.chopify.outputs.clips }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: telegram-video-clipper-uploads
        run: |
          python - <<'PY'
          import os
          import json
          import time
          import random
          import boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError, BotoCoreError

          clips = json.loads(os.environ.get('CLIPS_JSON') or '[]')
          job_id = os.environ['JOB_ID']

          required_env = ('R2_ACCOUNT_ID', 'R2_ACCESS_KEY_ID', 'R2_SECRET_ACCESS_KEY', 'R2_BUCKET')
          missing_env = [name for name in required_env if not os.environ.get(name)]
          if missing_env:
              raise RuntimeError(f"Missing R2 upload configuration: {', '.join(missing_env)}")

          s3 = boto3.client(
              's3',
              endpoint_url=f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],
              config=Config(
                  signature_version='s3v4',
                  connect_timeout=20,
                  read_timeout=120,
                  retries={'mode': 'standard', 'total_max_attempts': 3},
              ),
              region_name='auto',
          )

          uploaded = []
          transient_codes = {
              'InternalError', 'InternalServerError', 'ServiceUnavailable',
              'SlowDown', 'RequestTimeout', 'RequestTimeoutException',
          }
          for clip in clips:
              key = f'jobs/{job_id}/{os.path.basename(clip)}'
              for attempt in range(1, 6):
                  try:
                      s3.upload_file(clip, os.environ['R2_BUCKET'], key)
                      uploaded.append(key)
                      print(f'Uploaded {clip} to {key}')
                      break
                  except (ClientError, BotoCoreError) as exc:
                      response = getattr(exc, 'response', {}) or {}
                      error = response.get('Error', {}) or {}
                      code = str(error.get('Code', ''))
                      status = int((response.get('ResponseMetadata', {}) or {}).get('HTTPStatusCode', 0) or 0)
                      retryable = code in transient_codes or status >= 500 or isinstance(exc, BotoCoreError)
                      if not retryable or attempt == 5:
                          print(f'Upload failed for {key} after {attempt} attempt(s): {code or type(exc).__name__}; HTTP {status}')
                          raise
                      delay = min(30, 2 ** (attempt - 1)) + random.uniform(0, 1)
                      print(f'Transient R2 upload error for {key} (attempt {attempt}/5, {code or status}); retrying in {delay:.1f}s')
                      time.sleep(delay)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'uploaded={json.dumps(uploaded)}\n')
          PY

      - name: Report completion to Worker
        if: always()
        env:
          JOB_ID: ${{ github.event.client_payload.job_id || inputs.job_id }}
          CLIPS_JSON: ${{ steps.upload.outputs.uploaded }}
          CHOPIFY_OUTCOME: ${{ steps.chopify.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          python - <<'PY'
          import os
          import json
          import sys
          import requests

          job_id = os.environ['JOB_ID']
          worker_url = os.environ['WORKER_URL']
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"

          chopify = os.environ.get('CHOPIFY_OUTCOME', '')
          upload = os.environ.get('UPLOAD_OUTCOME', '')
          success = chopify == 'success' and upload == 'success'
          clips = json.loads(os.environ.get('CLIPS_JSON') or '[]') if success else []

          payload = {'clips': clips, 'status': 'completed' if success else 'failed', 'github_run_url': run_url}
          if not success:
              payload['error_message'] = f'Workflow failed (processing: {chopify or "not run"}, upload: {upload or "not run"}). See {run_url}'

          response = requests.post(
              f'{worker_url}/api/internal/jobs/{job_id}/complete',
              headers={'Authorization': f"Bearer {os.environ['WORKER_SECRET']}", 'Content-Type': 'application/json'},
              json=payload,
              timeout=30,
          )
          print(f'Report completion: {response.status_code} {response.text}')
          if not response.ok:
              sys.exit(1)
          PY