name: Process Video

on:
  repository_dispatch:
    types: [process-video]
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID'
        required: true
        type: string
      upload_id:
        description: 'Upload ID'
        required: true
        type: string
      source_url:
        description: 'YouTube URL (only for uploads created by a YouTube import)'
        required: false
        type: string
      object_key:
        description: 'R2 object key of the upload (required when source_url is set)'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  WORKER_URL: ${{ secrets.WORKER_URL }}
  WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# NOTE on step outputs: every `python` step below writes its step outputs
# explicitly to the file named by $GITHUB_OUTPUT as `key=value` lines. Printing
# to stdout is for logs only. (Piping stdout into $GITHUB_OUTPUT makes the runner
# reject any log line that is not `key=value` with "Invalid format".)

jobs:
  extract-youtube:
    name: Extract YouTube source to R2
    runs-on: [self-hosted, linux, x64, youtube-extractor]
    timeout-minutes: 30
    # Only YouTube sources are extracted here. Non-YouTube sources are downloaded
    # directly by the `process` job from a Worker presigned URL.
    if: ${{ (github.event_name == 'repository_dispatch' && (contains(github.event.client_payload.source_url || '', 'youtube.com') || contains(github.event.client_payload.source_url || '', 'youtu.be'))) || (github.event_name == 'workflow_dispatch' && (contains(inputs.source_url || '', 'youtube.com') || contains(inputs.source_url || '', 'youtu.be'))) }}
    outputs:
      source_r2_key: ${{ steps.upload.outputs.source_r2_key }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check dispatch payload
        id: validate
        env:
          JOB_ID: ${{ github.event.client_payload.job_id || github.event.inputs.job_id }}
          UPLOAD_ID: ${{ github.event.client_payload.upload_id || github.event.inputs.upload_id }}
          SOURCE_URL: ${{ github.event.client_payload.source_url || inputs.source_url || '' }}
        run: |
          echo "event=${{ github.event_name }} job_id=${JOB_ID} upload_id=${UPLOAD_ID}"
          if [ -z "$JOB_ID" ] || [ -z "$UPLOAD_ID" ] || [ -z "$SOURCE_URL" ]; then
            echo "::error::Missing job_id/upload_id/source_url for YouTube extraction."
            exit 1
          fi
          case "$SOURCE_URL" in
            *youtube.com*|*youtu.be*) echo "is_youtube=1" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Source is not a YouTube URL: $SOURCE_URL"; exit 1 ;;
          esac

      - name: Verify runner prerequisites
        shell: bash
        run: |
          missing=""
          for tool in python3 ffmpeg ffprobe; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::Runner is missing:$missing. In Ubuntu run: sudo apt install -y python3 ffmpeg (see docs/YOUTUBE_RUNNER_SETUP.md)."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Deno (JavaScript runtime yt-dlp needs for YouTube)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --upgrade "yt-dlp[default]" boto3 requests
          echo "Deno runtime:"
          command -v deno
          deno --version
          echo "yt-dlp and EJS package versions:"
          python -m pip show yt-dlp yt-dlp-ejs
          python - <<'PY'
          import importlib.metadata
          import re
          import subprocess

          deno_output = subprocess.check_output(["deno", "--version"], text=True)
          match = re.search(r"deno (\d+)\.(\d+)\.(\d+)", deno_output)
          if not match or tuple(map(int, match.groups())) < (2, 3, 0):
              raise SystemExit("Deno >= 2.3.0 is required by yt-dlp EJS.")
          for package in ("yt-dlp", "yt-dlp-ejs"):
              print(f"{package}=={importlib.metadata.version(package)}")
          PY

      - name: Download YouTube video
        id: download
        shell: bash
        env:
          SOURCE_URL: ${{ github.event.client_payload.source_url || inputs.source_url || '' }}
          JOB_ID: ${{ github.event.client_payload.job_id || github.event.inputs.job_id }}
          # Optional. Base64 of a Netscape cookies.txt from a throwaway Google account.
          YTDLP_COOKIES_B64: ${{ secrets.YTDLP_COOKIES_B64 }}
        run: |
          python - <<'PY'
          import base64
          import glob
          import os
          import subprocess
          import sys

          url = os.environ['SOURCE_URL']
          job_id = os.environ['JOB_ID']
          temp = os.environ.get('RUNNER_TEMP') or os.environ.get('TEMP') or '/tmp'
          out_tmpl = os.path.join(temp, f'yt_source_{job_id}.%(ext)s')
          cookies_path = os.path.join(temp, f'yt_cookies_{job_id}.txt')

          def cleanup_partials():
              for path in glob.glob(os.path.join(temp, f'yt_source_{job_id}.*')):
                  try:
                      os.unlink(path)
                  except OSError:
                      pass

          # Up to 1080p video + audio merged into one mp4 (ffmpeg is a runner prerequisite).
          cmd = [
              sys.executable, '-m', 'yt_dlp',
              '--js-runtimes', 'deno',
              '-f', 'bv*[height<=1080]+ba/b[height<=1080]/bv*+ba/b',
              '--merge-output-format', 'mp4',
              '--no-playlist',
              '--no-progress',
              '-o', out_tmpl,
          ]
          cookies_b64 = os.environ.get('YTDLP_COOKIES_B64', '').strip()
          if cookies_b64:
              fd = os.open(cookies_path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
              with os.fdopen(fd, 'wb') as fh:
                  fh.write(base64.b64decode(cookies_b64))
              cmd += ['--cookies', cookies_path]
              print('Using configured YouTube cookies.')
          cmd.append(url)

          print('Downloading YouTube source...')
          try:
              subprocess.run(cmd, check=True)
          except subprocess.CalledProcessError:
              # Clean up any partial downloads on failure.
              cleanup_partials()
              raise
          finally:
              # Cookies never stay on disk after the step.
              try:
                  os.unlink(cookies_path)
              except OSError:
                  pass

          matches = [m for m in glob.glob(os.path.join(temp, f'yt_source_{job_id}.*'))
                     if not m.endswith(('.part', '.ytdl'))]
          if not matches:
              raise SystemExit('YouTube download produced no file')
          mp4s = [m for m in matches if m.endswith('.mp4')]
          video = max(mp4s or matches, key=os.path.getsize)
          print(f'Downloaded {os.path.getsize(video)} bytes to {video}')
          if os.path.getsize(video) == 0:
              os.unlink(video)
              raise RuntimeError('Downloaded file is empty')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'video_path={video}\n')
          PY

      - name: Upload source to R2
        id: upload
        shell: bash
        env:
          JOB_ID: ${{ github.event.client_payload.job_id || github.event.inputs.job_id }}
          OBJECT_KEY: ${{ github.event.client_payload.object_key || inputs.object_key || '' }}
          VIDEO_PATH: ${{ steps.download.outputs.video_path }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: telegram-video-clipper-uploads
        run: |
          python - <<'PY'
          import os
          import random
          import time
          import boto3
          from boto3.s3.transfer import TransferConfig
          from botocore.config import Config
          from botocore.exceptions import BotoCoreError, ClientError

          job_id = os.environ['JOB_ID']
          video_path = os.environ['VIDEO_PATH']
          object_key = os.environ.get('OBJECT_KEY') or ''
          key = object_key or f'jobs/{job_id}/source.mp4'
          bucket = os.environ['R2_BUCKET']
          file_size = os.path.getsize(video_path)
          if file_size <= 0:
              raise RuntimeError('Downloaded YouTube source is empty')

          # Limit concurrent multipart parts and use longer timeouts. This
          # reduces pressure on the self-hosted runner's network connection.
          s3 = boto3.client(
              's3',
              endpoint_url=f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],
              config=Config(
                  signature_version='s3v4',
                  connect_timeout=30,
                  read_timeout=300,
                  tcp_keepalive=True,
                  retries={'mode': 'standard', 'total_max_attempts': 10},
              ),
              region_name='auto',
          )
          transfer = TransferConfig(
              multipart_threshold=64 * 1024 * 1024,
              multipart_chunksize=16 * 1024 * 1024,
              max_concurrency=2,
              use_threads=True,
          )

          try:
              # Retry the complete transfer if a transient TLS/socket error
              # escapes botocore's individual-request retry handling.
              for attempt in range(1, 6):
                  try:
                      print(
                          f'Uploading source to R2 (attempt {attempt}/5, '
                          f'{file_size / (1024 * 1024):.1f} MiB; 2 concurrent parts)...'
                      )
                      s3.upload_file(video_path, bucket, key, Config=transfer)
                      break
                  except (BotoCoreError, ClientError) as exc:
                      response = getattr(exc, 'response', {}) or {}
                      error = response.get('Error', {}) or {}
                      code = str(error.get('Code', ''))
                      status = int(
                          (response.get('ResponseMetadata', {}) or {}).get('HTTPStatusCode', 0) or 0
                      )
                      retryable = (
                          isinstance(exc, BotoCoreError)
                          or code in {
                              'InternalError', 'InternalServerError', 'ServiceUnavailable',
                              'SlowDown', 'RequestTimeout', 'RequestTimeoutException',
                          }
                          or status >= 500
                      )
                      if not retryable or attempt == 5:
                          print(
                              f'R2 source upload failed after {attempt} attempt(s): '
                              f'{code or type(exc).__name__}; HTTP {status}'
                          )
                          raise
                      delay = min(60, 5 * (2 ** (attempt - 1))) + random.uniform(0, 2)
                      print(
                          f'Transient R2 upload failure ({code or type(exc).__name__}; '
                          f'HTTP {status}); retrying in {delay:.1f}s.'
                      )
                      time.sleep(delay)

              # Do not let the processing job start until the R2 object is verified.
              head = s3.head_object(Bucket=bucket, Key=key)
              remote_size = int(head.get('ContentLength', 0))
              if remote_size != file_size:
                  raise RuntimeError(
                      f'uploaded size mismatch: expected {file_size} bytes, '
                      f'found {remote_size}'
                  )
              print(f'Uploaded and verified {key} ({remote_size} bytes)')
          finally:
              # Always remove the temporary source file, even on failure.
              try:
                  os.unlink(video_path)
              except OSError:
                  pass

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'source_r2_key={key}\n')
          PY

  process:
    name: Process video and upload clips
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Always runs so non-YouTube jobs (where extract-youtube is skipped) still
    # process, and YouTube jobs whose extraction failed still report failure.
    needs: [extract-youtube]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check dispatch payload
        id: validate
        env:
          JOB_ID: ${{ github.event.client_payload.job_id || github.event.inputs.job_id }}
          UPLOAD_ID: ${{ github.event.client_payload.upload_id || github.event.inputs.upload_id }}
          OBJECT_KEY: ${{ github.event.client_payload.object_key || inputs.object_key || '' }}
          SOURCE_URL: ${{ github.event.client_payload.source_url || inputs.source_url || '' }}
        run: |
          echo "event=${{ github.event_name }} job_id=${JOB_ID} upload_id=${UPLOAD_ID}"
          if [ -z "$JOB_ID" ] || [ -z "$UPLOAD_ID" ]; then
            echo "::error::Missing job_id/upload_id in client_payload or workflow_dispatch inputs."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-noto-cjk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install requests boto3

      - name: Install and start free local AI selector
        shell: bash
        env:
          AI_MODEL: qwen3:4b-instruct-2507-q4_K_M
        run: |
          set -euo pipefail
          echo "Installing Ollama on the GitHub-hosted runner (not on the user's laptop)..."
          curl -fsSL https://ollama.com/install.sh | sh

          if ! curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
            nohup ollama serve >/tmp/chopify-ollama.log 2>&1 &
          fi

          ready=0
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Ollama did not start on the GitHub-hosted runner."
            tail -n 80 /tmp/chopify-ollama.log 2>/dev/null || true
            exit 1
          fi

          echo "Downloading the free quantized AI model: $AI_MODEL"
          ollama pull "$AI_MODEL"
          ollama show "$AI_MODEL" >/dev/null

          # Make one small real inference now so model startup/availability
          # failures are caught before the long transcription begins.
          curl --fail --silent --show-error http://127.0.0.1:11434/api/chat \
            -H 'Content-Type: application/json' \
            -d "{\"model\":\"$AI_MODEL\",\"stream\":false,\"format\":\"json\",\"options\":{\"num_ctx\":8192,\"num_predict\":32},\"messages\":[{\"role\":\"user\",\"content\":\"Reply with JSON only: {\\\"ready\\\":true}\"}]}" \
            >/tmp/chopify-ollama-smoke-test.json
          python - <<'PY'
          import json
          from pathlib import Path

          response = json.loads(Path("/tmp/chopify-ollama-smoke-test.json").read_text())
          content = response.get("message", {}).get("content", "")
          if not content.strip():
              raise SystemExit("Ollama returned an empty response during its smoke test.")
          print(f"Local AI model is ready: {response.get('model', 'unknown model')}")
          PY

      - name: Report job started
        shell: bash
        env:
          JOB_ID: ${{ github.event.client_payload.job_id || github.event.inputs.job_id }}
        run: |
          python - <<'PY'
          import os
          import requests

          job_id = os.environ['JOB_ID']
          worker_url = os.environ['WORKER_URL']
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"

          response = requests.post(
              f'{worker_url}/api/internal/jobs/{job_id}/complete',
              headers={'Authorization': f"Bearer {os.environ['WORKER_SECRET']}", 'Content-Type': 'application/json'},
              json={'clips': [], 'status': 'processing', 'github_run_url': run_url},
              timeout=30,
          )
          print(f'Report started: {response.status_code} {response.text}')
          response.raise_for_status()
          PY

      - name: Fail workflow when YouTube extraction failed
        if: ${{ always() && !contains(fromJSON('["success","skipped"]'), needs.extract-youtube.result) }}
        shell: bash
        run: |
          echo "::error::YouTube extraction did not succeed (result: ${{ needs.extract-youtube.result }}); clipping was not started."
          exit 1

      - name: Download video via Worker presigned URL
        id: download
        if: ${{ needs.extract-youtube.outputs.source_r2_key == '' }}
        shell: bash
        env:
          JOB_ID: ${{ github.event.client_payload.job_id || github.event.inputs.job_id }}
          SOURCE_URL: ${{ github.event.client_payload.source_url || '' }}
          SOURCE_VIDEO: /tmp/video_${{ github.run_id }}.mp4
        run: |
          python - <<'PY'
          import os
          import requests

          job_id = os.environ['JOB_ID']
          worker_url = os.environ['WORKER_URL']
          worker_secret = os.environ['WORKER_SECRET']
          local_path = os.environ['SOURCE_VIDEO']

          # Fetch short-lived presigned download URL from Worker
          resp = requests.get(
              f'{worker_url}/api/internal/jobs/{job_id}/download-url',
              headers={'Authorization': f'Bearer {worker_secret}'},
              timeout=30,
          )
          resp.raise_for_status()
          data = resp.json()['data']
          download_url = data['url']

          # Download video via HTTP streaming (presigned URL never logged)
          print(f'Downloading video from Worker presigned URL...')
          with requests.get(download_url, stream=True, timeout=300) as r:
              r.raise_for_status()
              with open(local_path, 'wb') as f:
                  for chunk in r.iter_content(chunk_size=8192):
                      f.write(chunk)

          size = os.path.getsize(local_path)
          print(f'Downloaded {size} bytes to {local_path}')
          if size == 0:
              raise RuntimeError('Downloaded file is empty')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'video_path={local_path}\n')
          PY

      - name: Fetch YouTube source from R2
        id: fetch-source
        if: ${{ needs.extract-youtube.outputs.source_r2_key != '' }}
        shell: bash
        env:
          JOB_ID: ${{ github.event.client_payload.job_id || github.event.inputs.job_id }}
          SOURCE_R2_KEY: ${{ needs.extract-youtube.outputs.source_r2_key }}
          SOURCE_VIDEO: /tmp/video_${{ github.run_id }}.mp4
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: telegram-video-clipper-uploads
        run: |
          python - <<'PY'
          import os
          import boto3
          from botocore.config import Config

          job_id = os.environ['JOB_ID']
          key = os.environ['SOURCE_R2_KEY']
          local_path = os.environ['SOURCE_VIDEO']

          s3 = boto3.client(
              's3',
              endpoint_url=f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],
              config=Config(signature_version='s3v4', connect_timeout=20, read_timeout=120),
              region_name='auto',
          )
          print(f'Downloading source {key} from R2...')
          s3.download_file(os.environ['R2_BUCKET'], key, local_path)
          size = os.path.getsize(local_path)
          print(f'Downloaded {size} bytes to {local_path}')
          if size == 0:
              raise RuntimeError('Downloaded file is empty')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'video_path={local_path}\n')
          PY

      - name: Get job preferences
        id: prefs
        shell: bash
        env:
          JOB_ID: ${{ github.event.client_payload.job_id || github.event.inputs.job_id }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests

          job_id = os.environ['JOB_ID']
          response = requests.get(
              f"{os.environ['WORKER_URL']}/api/internal/jobs/{job_id}",
              headers={'Authorization': f"Bearer {os.environ['WORKER_SECRET']}"},
              timeout=30,
          )
          response.raise_for_status()
          job = response.json()['data']
          print(f'Job: {json.dumps(job)}')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"aspect_ratio={job.get('aspect_ratio') or '9:16'}\n")
              out.write(f"style={job.get('caption_style') or 'default'}\n")
              out.write(f"enable_tighten={job.get('enable_tighten') or 0}\n")
              out.write(f"enable_loudnorm={job.get('enable_loudnorm') or 0}\n")
          PY

      - name: Run Chopify processing
        id: chopify
        shell: bash
        env:
          VIDEO_PATH: ${{ steps.download.outputs.video_path || steps.fetch-source.outputs.video_path }}
          ASPECT_RATIO: ${{ steps.prefs.outputs.aspect_ratio }}
          STYLE: ${{ steps.prefs.outputs.style }}
          ENABLE_TIGHTEN: ${{ steps.prefs.outputs.enable_tighten }}
          ENABLE_LOUDNORM: ${{ steps.prefs.outputs.enable_loudnorm }}
          JOB_ID: ${{ github.event.client_payload.job_id || github.event.inputs.job_id }}
          AI_MODEL: qwen3:4b-instruct-2507-q4_K_M
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import json

          video_path = os.environ['VIDEO_PATH']
          aspect_ratio = os.environ['ASPECT_RATIO']
          style = os.environ['STYLE']
          enable_tighten = os.environ['ENABLE_TIGHTEN'] == '1'
          enable_loudnorm = os.environ['ENABLE_LOUDNORM'] == '1'
          job_id = os.environ['JOB_ID']
          ai_model = os.environ['AI_MODEL']

          work_dir = f'/tmp/chopify_work_{job_id}'
          os.makedirs(work_dir, exist_ok=True)
          out_dir = f'{work_dir}/clips'
          os.makedirs(out_dir, exist_ok=True)

          cmd = [
              'python', 'chopify.py', video_path,
              '--aspect', aspect_ratio,
              '--style', style,
              '--workdir', work_dir,
              '--out', out_dir,
              '--action', 'all',
              '--no-preflight',
              '--max-clips', '3',
              '--min-score', '5.5',
              '--min-len', '60',
              '--max-len', '180',
          ]
          # This is a model-backed editorial pass, not the keyword heuristic.
          # Strict mode prevents silent fallback to the old selector.
          cmd += ['--llm', ai_model, '--strict-llm']
          if enable_tighten:
              cmd.append('--tighten')
          if enable_loudnorm:
              cmd.append('--loudnorm')

          display_cmd = cmd.copy()
          if video_path.startswith('https://www.youtube.com/'):
              display_cmd[2] = '[YouTube URL redacted]'
          print('Running: ' + ' '.join(display_cmd))
          result = subprocess.run(cmd, capture_output=True, text=True, cwd='.')
          safe_stdout = result.stdout.replace(video_path, '[YouTube URL redacted]') if video_path.startswith('https://www.youtube.com/') else result.stdout
          safe_stderr = result.stderr.replace(video_path, '[YouTube URL redacted]') if video_path.startswith('https://www.youtube.com/') else result.stderr
          print(f'stdout: {safe_stdout}')
          print(f'stderr: {safe_stderr}')
          print(f'returncode: {result.returncode}')

          if result.returncode != 0:
              sys.exit(1)

          clips = [os.path.join(out_dir, f) for f in sorted(os.listdir(out_dir)) if f.endswith('.mp4')]
          print(f'Found {len(clips)} clip(s)')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'clips={json.dumps(clips)}\n')
          PY

      - name: Upload clips to R2
        id: upload
        shell: bash
        env:
          JOB_ID: ${{ github.event.client_payload.job_id || github.event.inputs.job_id }}
          CLIPS_JSON: ${{ steps.chopify.outputs.clips }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: telegram-video-clipper-uploads
        run: |
          python - <<'PY'
          import os
          import json
          import time
          import random
          import boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError, BotoCoreError

          clips = json.loads(os.environ.get('CLIPS_JSON') or '[]')
          job_id = os.environ['JOB_ID']

          required_env = ('R2_ACCOUNT_ID', 'R2_ACCESS_KEY_ID', 'R2_SECRET_ACCESS_KEY', 'R2_BUCKET')
          missing_env = [name for name in required_env if not os.environ.get(name)]
          if missing_env:
              raise RuntimeError(f"Missing R2 upload configuration: {', '.join(missing_env)}")

          s3 = boto3.client(
              's3',
              endpoint_url=f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],
              config=Config(
                  signature_version='s3v4',
                  connect_timeout=20,
                  read_timeout=120,
                  retries={'mode': 'standard', 'total_max_attempts': 3},
              ),
              region_name='auto',
          )

          uploaded = []
          transient_codes = {
              'InternalError', 'InternalServerError', 'ServiceUnavailable',
              'SlowDown', 'RequestTimeout', 'RequestTimeoutException',
          }
          for clip in clips:
              key = f'jobs/{job_id}/{os.path.basename(clip)}'
              for attempt in range(1, 6):
                  try:
                      s3.upload_file(clip, os.environ['R2_BUCKET'], key)
                      uploaded.append(key)
                      print(f'Uploaded {clip} to {key}')
                      break
                  except (ClientError, BotoCoreError) as exc:
                      response = getattr(exc, 'response', {}) or {}
                      error = response.get('Error', {}) or {}
                      code = str(error.get('Code', ''))
                      status = int((response.get('ResponseMetadata', {}) or {}).get('HTTPStatusCode', 0) or 0)
                      retryable = code in transient_codes or status >= 500 or isinstance(exc, BotoCoreError)
                      if not retryable or attempt == 5:
                          print(f'Upload failed for {key} after {attempt} attempt(s): {code or type(exc).__name__}; HTTP {status}')
                          raise
                      delay = min(30, 2 ** (attempt - 1)) + random.uniform(0, 1)
                      print(f'Transient R2 upload error for {key} (attempt {attempt}/5, {code or status}); retrying in {delay:.1f}s')
                      time.sleep(delay)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'uploaded={json.dumps(uploaded)}\n')
          PY

      - name: Report completion to Worker
        if: always()
        shell: bash
        env:
          JOB_ID: ${{ github.event.client_payload.job_id || github.event.inputs.job_id }}
          CLIPS_JSON: ${{ steps.upload.outputs.uploaded }}
          CHOPIFY_OUTCOME: ${{ steps.chopify.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          python - <<'PY'
          import os
          import json
          import sys
          import requests

          job_id = os.environ['JOB_ID']
          worker_url = os.environ['WORKER_URL']
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"

          chopify = os.environ.get('CHOPIFY_OUTCOME', '')
          upload = os.environ.get('UPLOAD_OUTCOME', '')
          success = chopify == 'success' and upload == 'success'
          clips = json.loads(os.environ.get('CLIPS_JSON') or '[]') if success else []

          payload = {'clips': clips, 'status': 'completed' if success else 'failed', 'github_run_url': run_url}
          if not success:
              payload['error_message'] = f'Workflow failed (processing: {chopify or "not run"}, upload: {upload or "not run"}). See {run_url}'

          response = requests.post(
              f'{worker_url}/api/internal/jobs/{job_id}/complete',
              headers={'Authorization': f"Bearer {os.environ['WORKER_SECRET']}", 'Content-Type': 'application/json'},
              json=payload,
              timeout=30,
          )
          print(f'Report completion: {response.status_code} {response.text}')
          if not response.ok:
              sys.exit(1)
          PY