name: Test YouTube Extraction

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube URL to test extraction against'
        required: false
        default: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ'
      section_start:
        description: 'Start time for section download test (seconds)'
        required: false
        default: '10'
      section_end:
        description: 'End time for section download test (seconds)'
        required: false
        default: '16'

jobs:
  test-youtube-extraction:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-noto-cjk nodejs npm

      - name: Install Deno
        run: |
          curl -fsSL https://deno.land/x/install/install.sh | DENO_INSTALL=/tmp/deno_install sh
          echo "/tmp/deno_install/bin" >> $GITHUB_PATH
          export PATH="/tmp/deno_install/bin:$PATH"
          deno --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install PO Token Provider
        run: |
          # Clone the bgutil-ytdlp-pot-provider server for PO token generation
          git clone --depth 1 --branch 2.0.2 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /tmp/bgutil-pot-provider
          cd /tmp/bgutil-pot-provider/server
          npm ci
          npx tsc

      - name: Start PO Token Provider server
        run: |
          nohup node /tmp/bgutil-pot-provider/server/build/main.js > /tmp/bgutil-pot-provider.log 2>&1 &
          echo $! > /tmp/bgutil-pot-provider.pid
          # Wait for server to be ready
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:4416/ > /dev/null 2>&1; then
              echo "PO Token Provider server is ready."
              exit 0
            fi
            sleep 1
          done
          echo "::error::PO Token Provider server failed to start."
          cat /tmp/bgutil-pot-provider.log
          exit 1
        env:
          YTDLP_POT_PROVIDER_URL: http://127.0.0.1:4416

      - name: Validate inputs
        id: validate
        run: |
          URL="${{ github.event.inputs.youtube_url || 'https://www.youtube.com/watch?v=dQw4w9WgXcQ' }}"
          START="${{ github.event.inputs.section_start || '10' }}"
          END="${{ github.event.inputs.section_end || '16' }}"

          # Validate YouTube URL
          if ! echo "$URL" | grep -qE '^https?://(www\.)?(youtube\.com/watch\?v=|youtu\.be/)'; then
            echo "::error::Invalid YouTube URL: $URL"
            exit 1
          fi

          # Validate section times are integers
          if ! echo "$START" | grep -qE '^[0-9]+$'; then
            echo "::error::section_start must be a non-negative integer: $START"
            exit 1
          fi
          if ! echo "$END" | grep -qE '^[0-9]+$'; then
            echo "::error::section_end must be a non-negative integer: $END"
            exit 1
          fi

          # Validate start < end
          if [ "$START" -ge "$END" ]; then
            echo "::error::section_start ($START) must be less than section_end ($END)"
            exit 1
          fi

          echo "youtube_url=$URL" >> $GITHUB_OUTPUT
          echo "section_start=$START" >> $GITHUB_OUTPUT
          echo "section_end=$END" >> $GITHUB_OUTPUT

      - name: Verify yt-dlp and Deno availability
        env:
          YTDLP_POT_PROVIDER_URL: http://127.0.0.1:4416
        run: |
          echo "=== Deno version ==="
          deno --version
          echo "=== yt-dlp version ==="
          python -m yt_dlp --version

      - name: Verify PO Token Provider installation and real token generation
        env:
          YTDLP_VERBOSE: "1"
          YTDLP_POT_PROVIDER_URL: http://127.0.0.1:4416
          YOUTUBE_URL: ${{ steps.validate.outputs.youtube_url }}
        run: |
          # Fail immediately if the plugin wheel was not installed into this Python environment.
          python -m pip show bgutil-ytdlp-pot-provider

          python - <<'PY'
          import os
          import re
          import subprocess
          import sys

          sys.path.insert(0, '.')
          import download_and_transcribe as dt

          url = os.environ['YOUTUBE_URL']
          cmd = [sys.executable, "-m", "yt_dlp", "--list-formats"]
          cmd.extend(dt._yt_dlp_common_args())
          cmd.append(url)

          print("Requesting format metadata with the real bgutil provider enabled...", flush=True)
          result = subprocess.run(cmd, capture_output=True, text=True)
          combined = result.stdout + "\n" + result.stderr

          # Print only provider diagnostics. Never dump arbitrary output or token values.
          diagnostic_lines = [
              line for line in combined.splitlines()
              if "[pot]" in line.lower()
              or "generating a " in line.lower() and "po token" in line.lower()
              or "error:" in line.lower()
          ]
          for line in diagnostic_lines:
              print(line, flush=True)

          provider_loaded = re.search(
              r"\[youtube\] \[pot\] PO Token Providers:.*bgutil:http-[\w.-]+ \(external\)",
              combined, re.IGNORECASE)
          token_requested = re.search(
              r"\[youtube\] \[pot:bgutil:http\] Generating a \w+ PO Token for .* via bgutil HTTP server",
              combined, re.IGNORECASE)

          if result.returncode != 0:
              print("::error::yt-dlp format extraction failed during provider verification.", flush=True)
              sys.exit(result.returncode)
          if not provider_loaded:
              print("::error::bgutil HTTP PO Token Provider was not registered with yt-dlp.", flush=True)
              sys.exit(1)
          if not token_requested:
              print("::error::No real PO-token generation request was observed. Provider configuration alone is not proof.", flush=True)
              sys.exit(1)

          print("Verified: bgutil HTTP provider registered and a real GVS/player PO-token request was made.", flush=True)

          # Ensure Python API call sites carry the same EJS/runtime/provider configuration.
          opts = dt._yt_dlp_ydl_opts()
          assert opts.get("js_runtimes") == {"deno": {}}
          assert "ejs:github" in opts.get("remote_components", set())
          assert opts["extractor_args"]["youtube"]["fetch_pot"] == ["always"]
          assert opts["extractor_args"]["youtube"]["player_client"][0] == "mweb"
          print("Verified: Python API configuration includes Deno, EJS, PO-token fetching and mweb-first clients.", flush=True)
          PY

      - name: Test YouTube metadata extraction
        id: metadata
        env:
          YOUTUBE_URL: ${{ steps.validate.outputs.youtube_url }}
          YTDLP_VERBOSE: "1"
        run: |
          python - <<'PY'
          import sys
          import os
          sys.path.insert(0, '.')
          import download_and_transcribe as dt

          url = os.environ['YOUTUBE_URL']

          try:
              info = dt.inspect_source(url)
              print(f"Video ID: {info['id']}")
              print(f"Title: {info['title']}")
              print(f"Duration: {info['duration']}s")
              print(f"Uploader: {info['uploader']}")
              print(f"Manual subtitles: {info['manual_subtitles']}")
              print(f"Automatic subtitles: {info['automatic_subtitles']}")

              with open('/tmp/yt_metadata.txt', 'w') as f:
                  f.write(f"id={info['id']}\n")
                  f.write(f"title={info['title']}\n")
                  f.write(f"duration={info['duration']}\n")
          except Exception as e:
              print(f"::error::Metadata extraction failed: {e}")
              sys.exit(1)
          PY

      - name: Test YouTube subtitles retrieval
        id: subtitles
        env:
          YOUTUBE_URL: ${{ steps.validate.outputs.youtube_url }}
        run: |
          python - <<'PY'
          import sys
          import os
          import tempfile
          from pathlib import Path

          sys.path.insert(0, '.')
          import download_and_transcribe as dt

          url = os.environ['YOUTUBE_URL']

          with tempfile.TemporaryDirectory(prefix='yt-subs-') as temp:
              try:
                  sub_path = dt.download_subtitles(url, Path(temp), langs=("en", "en-orig"))
                  if sub_path:
                      content = sub_path.read_text(encoding="utf-8-sig")
                      print(f"Subtitles retrieved: {sub_path.name} ({len(content)} bytes)")
                      print(f"First 200 chars: {content[:200]}")
                      with open('/tmp/yt_subs_info.txt', 'w') as f:
                          f.write(f"path={sub_path}\n")
                          f.write(f"size={len(content)}\n")
                  else:
                      print("No subtitles found (may be auto-generated only or none available)")
              except Exception as e:
                  print(f"::error::Subtitle retrieval failed: {e}")
                  sys.exit(1)
          PY

      - name: Test YouTube section download
        id: section
        env:
          YOUTUBE_URL: ${{ steps.validate.outputs.youtube_url }}
          SECTION_START: ${{ steps.validate.outputs.section_start }}
          SECTION_END: ${{ steps.validate.outputs.section_end }}
        run: |
          python - <<'PY'
          import sys
          import os
          import tempfile
          import json as _json
          from pathlib import Path

          sys.path.insert(0, '.')
          import download_and_transcribe as dt

          url = os.environ['YOUTUBE_URL']
          start = float(os.environ['SECTION_START'])
          end = float(os.environ['SECTION_END'])

          with tempfile.TemporaryDirectory(prefix='yt-test-') as temp:
              try:
                  section = dt.download_section(url, start, end, Path(temp), retries=2)
                  print(f"Section file: {section}")
                  print(f"Section size: {section.stat().st_size} bytes")

                  import subprocess
                  result = subprocess.run(
                      ['ffprobe', '-v', 'error', '-show_entries',
                       'stream=codec_type,codec_name,width,height,sample_rate',
                       '-of', 'json', str(section)],
                      capture_output=True, text=True, check=True)
                  probe = _json.loads(result.stdout)
                  video_streams = [s for s in probe.get('streams', [])
                                   if s.get('codec_type') == 'video']
                  audio_streams = [s for s in probe.get('streams', [])
                                   if s.get('codec_type') == 'audio']
                  if not video_streams:
                      print("::error::No video stream found in section file")
                      sys.exit(1)
                  if not audio_streams:
                      print("::error::No audio stream found in section file")
                      sys.exit(1)
                  vs = video_streams[0]
                  as_ = audio_streams[0]
                  print(f"Video stream: {vs.get('codec_name')} {vs.get('width')}x{vs.get('height')}")
                  print(f"Audio stream: {as_.get('codec_name')} {as_.get('sample_rate')}Hz")

                  with open('/tmp/yt_section_info.txt', 'w') as f:
                      f.write(f"path={section}\n")
                      f.write(f"size={section.stat().st_size}\n")
                      f.write(f"video_codec={vs.get('codec_name')}\n")
                      f.write(f"video_width={vs.get('width')}\n")
                      f.write(f"video_height={vs.get('height')}\n")
                      f.write(f"audio_codec={as_.get('codec_name')}\n")
              except Exception as e:
                  print(f"::error::Section download failed: {e}")
                  sys.exit(1)
          PY

      - name: Summarize results
        run: |
          echo "=== Metadata ==="
          cat /tmp/yt_metadata.txt 2>/dev/null || echo "No metadata"
          echo ""
          echo "=== Subtitles ==="
          cat /tmp/yt_subs_info.txt 2>/dev/null || echo "No subtitles info"
          echo ""
          echo "=== Section ==="
          cat /tmp/yt_section_info.txt 2>/dev/null || echo "No section"

      - name: Stop PO Token Provider server
        if: always()
        run: |
          if [ -f /tmp/bgutil-pot-provider.pid ]; then
            kill $(cat /tmp/bgutil-pot-provider.pid) 2>/dev/null || true
          fi
