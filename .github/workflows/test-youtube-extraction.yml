name: Test YouTube Extraction

on:
  push:
    branches: [fix/youtube-bot-detection]
    paths:
      - 'download_and_transcribe.py'
      - 'requirements.txt'
      - '.github/workflows/test-youtube-extraction.yml'
      - '.github/workflows/process-video.yml'
  pull_request:
    branches: [main]
    paths:
      - 'download_and_transcribe.py'
      - 'requirements.txt'
      - '.github/workflows/test-youtube-extraction.yml'
      - '.github/workflows/process-video.yml'
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube URL to test extraction against'
        required: false
        default: 'https://www.youtube.com/watch?v=jNQXAC9IVRw'
        type: string
      section_start:
        description: 'Start time for section download test (seconds)'
        required: false
        default: '10'
        type: string
      section_end:
        description: 'End time for section download test (seconds)'
        required: false
        default: '16'
        type: string

permissions:
  contents: read

jobs:
  test-youtube-extraction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YTDLP_PO_TOKEN: ${{ secrets.YTDLP_PO_TOKEN }}
    steps:
      - name: Require the PR branch for manual runs
        if: github.event_name == 'workflow_dispatch'
        env:
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "Validation branch: $REF_NAME"
          echo "Validation commit: $COMMIT_SHA"
          if [ "$REF_NAME" != "fix/youtube-bot-detection" ]; then
            echo "::error::Run this workflow using the fix/youtube-bot-detection branch selector, not main."
            exit 1
          fi

      - name: Checkout the exact PR head (or selected manual-run ref)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked-out revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Expected source commit: $EXPECTED_SHA"
          echo "Checked out: $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Deno JavaScript runtime
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Prepare optional YouTube credentials
        id: youtube_credentials
        env:
          YTDLP_COOKIES_B64: ${{ secrets.YTDLP_COOKIES_B64 }}
        run: |
          python - <<'PY'
          import base64
          import os
                    import tempfile

          encoded = os.environ.get("YTDLP_COOKIES_B64", "").strip()
          if not encoded:
              print("No YTDLP_COOKIES_B64 secret configured; testing without cookies.")
              raise SystemExit(0)

          try:
              data = base64.b64decode(encoded, validate=True)
          except Exception as exc:
              raise SystemExit("YTDLP_COOKIES_B64 is not valid base64.") from exc

          lines = data.decode("utf-8-sig", errors="strict").splitlines()
          cookie_rows = [line for line in lines if line and not line.startswith("#")]
          valid_rows = [line for line in cookie_rows if len(line.split("\t")) == 7]
          if not valid_rows or not any("youtube.com" in line.lower() or "google.com" in line.lower() for line in valid_rows):
              raise SystemExit("Cookie secret is not a valid Netscape cookie file for YouTube/Google.")

          fd, cookie_path = tempfile.mkstemp(prefix="yt-cookies-", suffix=".txt", dir=os.environ["RUNNER_TEMP"])
          os.chmod(cookie_path, 0o600)
          with os.fdopen(fd, "wb") as target:
              target.write(data)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"YTDLP_COOKIES_FILE={cookie_path}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"cookie_path={cookie_path}\n")
          print("YouTube cookie file prepared securely; contents and path are not logged.")
          PY

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies including yt-dlp EJS
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install --upgrade "yt-dlp[default]"
          python -m yt_dlp --version
          deno --version
          python - <<'PY'
          import importlib.metadata as m
          print("yt-dlp:", m.version("yt-dlp"))
          print("yt-dlp-ejs:", m.version("yt-dlp-ejs"))
          PY

      - name: Validate dispatch inputs
        id: validate
        env:
          INPUT_YOUTUBE_URL: ${{ inputs.youtube_url }}
          INPUT_SECTION_START: ${{ inputs.section_start }}
          INPUT_SECTION_END: ${{ inputs.section_end }}
        run: |
          python - <<'PY'
          import os, re, sys
          from urllib.parse import urlparse, parse_qs

          url = os.environ.get("INPUT_YOUTUBE_URL", "").strip() or "https://www.youtube.com/watch?v=jNQXAC9IVRw"
          start = os.environ.get("INPUT_SECTION_START", "").strip() or "10"
          end = os.environ.get("INPUT_SECTION_END", "").strip() or "16"

          parsed = urlparse(url)
          host = (parsed.hostname or "").lower()
          valid_host = host in {"youtube.com", "www.youtube.com", "m.youtube.com", "youtu.be"}
          valid_video = (
              (host == "youtu.be" and bool(parsed.path.strip("/"))) or
              (host != "youtu.be" and bool(parse_qs(parsed.query).get("v", [""])[0]))
          )
          if parsed.scheme != "https" or not valid_host or not valid_video or any(c in url for c in "\r\n"):
              print("::error::Invalid YouTube URL input")
              sys.exit(1)
          if not re.fullmatch(r"\d+(?:\.\d+)?", start) or not re.fullmatch(r"\d+(?:\.\d+)?", end):
              print("::error::Section bounds must be non-negative numbers")
              sys.exit(1)
          a, b = float(start), float(end)
          if b <= a or b - a > 120:
              print("::error::Section end must be after start and test sections may not exceed 120 seconds")
              sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"url={url}\nstart={a}\nend={b}\n")
          print(f"Validated YouTube URL; section {a:g}-{b:g}s")
          PY

      - name: Verify yt-dlp JavaScript challenge support and format availability
        env:
          YOUTUBE_URL: ${{ steps.validate.outputs.url }}
        run: |
          python - <<'PY'
          import os
          import yt_dlp
          import download_and_transcribe as dt

          options = dt._yt_dlp_ydl_opts()
          options.update({"quiet": True, "no_warnings": False, "skip_download": True, "listformats": True})
          with yt_dlp.YoutubeDL(options) as ydl:
              info = ydl.extract_info(os.environ["YOUTUBE_URL"], download=False)
          formats = info.get("formats") or []
          if not formats:
              raise SystemExit("yt-dlp returned no downloadable formats")
          print(f"PASS: JavaScript challenge handling initialized; {len(formats)} formats available.")
          PY

      - name: Test YouTube metadata extraction
        env:
          YOUTUBE_URL: ${{ steps.validate.outputs.url }}
        run: |
          python - <<'PY'
          import os
          import download_and_transcribe as dt
          info = dt.inspect_source(os.environ["YOUTUBE_URL"])
          print("Video ID:", info["id"])
          print("Title:", info["title"])
          print("Duration:", info["duration"])
          print("Manual subtitles:", info["manual_subtitles"])
          print("Automatic subtitles:", info["automatic_subtitles"])
          PY

      - name: Test YouTube section download and validate media
        env:
          YOUTUBE_URL: ${{ steps.validate.outputs.url }}
          SECTION_START: ${{ steps.validate.outputs.start }}
          SECTION_END: ${{ steps.validate.outputs.end }}
        run: |
          python - <<'PY'
          import json, os, subprocess, tempfile
          from pathlib import Path
          import download_and_transcribe as dt

          url = os.environ["YOUTUBE_URL"]
          start, end = float(os.environ["SECTION_START"]), float(os.environ["SECTION_END"])
          with tempfile.TemporaryDirectory(prefix="yt-extraction-") as temp:
              section = dt.download_section(url, start, end, Path(temp), retries=1)
              size = section.stat().st_size
              if size <= 1024:
                  raise SystemExit(f"Downloaded section is unexpectedly small: {size} bytes")
              probe = subprocess.run(
                  ["ffprobe", "-v", "error", "-show_entries",
                   "format=duration:stream=codec_type,codec_name,width,height",
                   "-of", "json", str(section)],
                  capture_output=True, text=True, check=True)
              info = json.loads(probe.stdout)
              videos = [s for s in info.get("streams", []) if s.get("codec_type") == "video"]
              if not videos:
                  raise SystemExit("ffprobe found no video stream")
              duration = float(info.get("format", {}).get("duration") or 0)
              if duration <= 0:
                  raise SystemExit("ffprobe reported an invalid media duration")
              print(f"PASS: {size} bytes, {duration:.2f}s, video={videos[0]}")
          PY

      - name: Remove temporary YouTube credentials
        if: always()
        env:
          COOKIE_PATH: ${{ steps.youtube_credentials.outputs.cookie_path }}
        run: |
          if [ -n "$COOKIE_PATH" ] && [ -f "$COOKIE_PATH" ]; then
            shred -u "$COOKIE_PATH" || rm -f "$COOKIE_PATH"
            echo "Temporary YouTube cookie file removed."
          fi
