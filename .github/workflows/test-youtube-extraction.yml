name: Test YouTube Extraction

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube URL to test extraction against'
        required: false
        default: 'https://www.youtube.com/watch?v=XtF6m2J0y1g'
      section_start:
        description: 'Start time for section download test (seconds)'
        required: false
        default: '10'
      section_end:
        description: 'End time for section download test (seconds)'
        required: false
        default: '16'

jobs:
  test-youtube-extraction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-noto-cjk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate inputs
        id: validate
        run: |
          URL="${{ github.event.inputs.youtube_url || 'https://www.youtube.com/watch?v=XtF6m2J0y1g' }}"
          START="${{ github.event.inputs.section_start || '10' }}"
          END="${{ github.event.inputs.section_end || '16' }}"

          # Validate YouTube URL
          if ! echo "$URL" | grep -qE '^https?://(www\.)?(youtube\.com/watch\?v=|youtu\.be/)'; then
            echo "::error::Invalid YouTube URL: $URL"
            exit 1
          fi

          # Validate section times are integers
          if ! echo "$START" | grep -qE '^[0-9]+$'; then
            echo "::error::section_start must be a non-negative integer: $START"
            exit 1
          fi
          if ! echo "$END" | grep -qE '^[0-9]+$'; then
            echo "::error::section_end must be a non-negative integer: $END"
            exit 1
          fi

          # Validate start < end
          if [ "$START" -ge "$END" ]; then
            echo "::error::section_start ($START) must be less than section_end ($END)"
            exit 1
          fi

          echo "youtube_url=$URL" >> $GITHUB_OUTPUT
          echo "section_start=$START" >> $GITHUB_OUTPUT
          echo "section_end=$END" >> $GITHUB_OUTPUT

      - name: Test YouTube metadata extraction
        id: metadata
        env:
          YOUTUBE_URL: ${{ steps.validate.outputs.youtube_url }}
        run: |
          python - <<'PY'
          import sys
          import os
          sys.path.insert(0, '.')
          import download_and_transcribe as dt

          url = os.environ['YOUTUBE_URL']

          try:
              info = dt.inspect_source(url)
              print(f"Video ID: {info['id']}")
              print(f"Title: {info['title']}")
              print(f"Duration: {info['duration']}s")
              print(f"Uploader: {info['uploader']}")
              print(f"Manual subtitles: {info['manual_subtitles']}")
              print(f"Automatic subtitles: {info['automatic_subtitles']}")

              # Write results for subsequent steps
              with open('/tmp/yt_metadata.txt', 'w') as f:
                  f.write(f"id={info['id']}\n")
                  f.write(f"title={info['title']}\n")
                  f.write(f"duration={info['duration']}\n")
          except Exception as e:
              print(f"::error::Metadata extraction failed: {e}")
              sys.exit(1)
          PY

      - name: Test YouTube section download
        id: section
        env:
          YOUTUBE_URL: ${{ steps.validate.outputs.youtube_url }}
          SECTION_START: ${{ steps.validate.outputs.section_start }}
          SECTION_END: ${{ steps.validate.outputs.section_end }}
        run: |
          python - <<'PY'
          import sys
          import os
          import tempfile
          from pathlib import Path

          sys.path.insert(0, '.')
          import download_and_transcribe as dt

          url = os.environ['YOUTUBE_URL']
          start = float(os.environ['SECTION_START'])
          end = float(os.environ['SECTION_END'])

          with tempfile.TemporaryDirectory(prefix='yt-test-') as temp:
              try:
                  section = dt.download_section(url, start, end, Path(temp), retries=2)
                  print(f"Section file: {section}")
                  print(f"Section size: {section.stat().st_size} bytes")

                  # Verify the file is a valid video with ffprobe
                  import subprocess
                  result = subprocess.run(
                      ['ffprobe', '-v', 'error', '-show_entries',
                       'stream=codec_type,codec_name,width,height',
                       '-of', 'json', str(section)],
                      capture_output=True, text=True, check=True)
                  import json as _json
                  probe = _json.loads(result.stdout)
                  video_streams = [s for s in probe.get('streams', [])
                                   if s.get('codec_type') == 'video']
                  if not video_streams:
                      print("::error::No video stream found in section file")
                      sys.exit(1)
                  vs = video_streams[0]
                  print(f"Video stream: {vs.get('codec_name')} {vs.get('width')}x{vs.get('height')}")

                  with open('/tmp/yt_section_info.txt', 'w') as f:
                      f.write(f"path={section}\n")
                      f.write(f"size={section.stat().st_size}\n")
                      f.write(f"video_codec={vs.get('codec_name')}\n")
                      f.write(f"video_width={vs.get('width')}\n")
                      f.write(f"video_height={vs.get('height')}\n")
              except Exception as e:
                  print(f"::error::Section download failed: {e}")
                  sys.exit(1)
          PY

      - name: Summarize results
        run: |
          echo "=== Metadata ==="
          cat /tmp/yt_metadata.txt 2>/dev/null || echo "No metadata"
          echo ""
          echo "=== Section ==="
          cat /tmp/yt_section_info.txt 2>/dev/null || echo "No section"
