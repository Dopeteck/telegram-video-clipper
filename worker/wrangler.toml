name = "telegram-video-clipper-worker"
main = "src/index.ts"
compatibility_date = "2024-01-15"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[vars]
WORKER_URL = "https://telegram-video-clipper-worker-production.adegunwa3.workers.dev"
MINIAPP_URL = "https://telegram-video-clipper-miniapp.pages.dev"
MAX_UPLOAD_BYTES = "2147483648"
CHUNK_SIZE = "5242880"
MAX_CONCURRENT_CHUNKS = "3"
UPLOAD_EXPIRY_HOURS = "24"
CLEANUP_INTERVAL_MINUTES = "60"
MAX_CONCURRENT_UPLOADS_PER_USER = "2"
RATE_LIMIT_WINDOW_SECONDS = "60"
RATE_LIMIT_MAX_REQUESTS = "30"
R2_BUCKET_NAME = "telegram-video-clipper-uploads"

[[d1_databases]]
binding = "DB"
database_name = "telegram-video-clipper"
database_id = "a16d2cd2-b642-49a3-b583-d4e897b22508"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "telegram-video-clipper-uploads"

[build]
command = "npm run build"

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
[alias]
"@aws-sdk/xml-builder" = "@aws-sdk/xml-builder/dist-cjs/index.js"
